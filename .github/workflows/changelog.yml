name: changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  changelog:
    # Every change adds an entry under Unreleased. Label a PR `skip-changelog` to bypass.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md' \
            || { echo '::error::Add an entry under Unreleased in CHANGELOG.md (or label the PR skip-changelog).'; exit 1; }
